description: Tri-State Behavior

compatible: "zmk,behavior-tri-state"

include: zero_param.yaml

properties:
  bindings:
    type: phandle-array
    required: true
  ignored-key-positions:
    type: array
    required: false
    default: []
  ignored-layers:
    type: array
    required: false
    default: []
  cancel-key-positions:
    type: array
    required: false
    default: []
  cancel-keycode:
    type: int
    default: 0
  timeout-ms:
    type: int
    default: -1
  tap-ms:
    type: int
    default: 5
